<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#116149" />
  <title>Lopes Tur</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* A integração automática da Uber foi desativada. */
    .uber-integration-disabled { display: none !important; }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><img class="brand-photo" src="lopes-tur-carro.png" alt="Carro Lopes Tur" /><div><span class="eyebrow">CONTROLE DO SEU CARRO</span><h1>Lopes Tur</h1></div></div><button class="icon-button" id="exportButton" title="Exportar dados">⇩</button></header>
  <main id="app" class="content"></main>
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button data-view="dashboard" class="active">⌂<span>Painel</span></button>
    <button data-view="income">＋<span>Ganhos</span></button>
    <button data-view="expense">−<span>Gastos</span></button>
    <button data-view="reports">▥<span>Relatórios</span></button>
    <button data-view="settings">⚙<span>Ajustes</span></button>
  </nav>
  <div id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="app.js?v=20260829"></script>
  <script>
    // Remove SOMENTE o cartão da integração automática da Uber.
    // A opção Uber para lançamento manual de ganhos permanece intacta.
    (function () {
      function removeUberIntegrationCard() {
        const app = document.getElementById('app');
        if (!app) return;

        const exactPhrases = [
          'sincronize viagens e ganhos da uber com o lopes tur',
          'conectar uber',
          'sincronizar agora'
        ];

        // Procura elementos que contenham o texto específico da integração.
        const all = Array.from(app.querySelectorAll('*'));
        all.forEach(el => {
          const text = (el.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
          if (!text) return;

          const matchesCard = text.includes(exactPhrases[0]);
          const matchesButtons = text.includes(exactPhrases[1]) && text.includes(exactPhrases[2]);
          if (!matchesCard && !matchesButtons) return;

          // Sobe até o menor container visual que contém o cartão, sem esconder #app.
          let target = el;
          for (let i = 0; i < 5 && target.parentElement && target.parentElement !== app; i++) {
            const parent = target.parentElement;
            const parentText = (parent.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
            if (parentText.includes('sincronize viagens') || (parentText.includes('conectar uber') && parentText.includes('sincronizar agora'))) {
              target = parent;
            } else {
              break;
            }
          }
          if (target !== app) target.classList.add('uber-integration-disabled');
        });
      }

      const observer = new MutationObserver(removeUberIntegrationCard);
      observer.observe(document.getElementById('app'), { childList: true, subtree: true });
      removeUberIntegrationCard();
      window.addEventListener('load', removeUberIntegrationCard);
    })();
  </script>
</body>
</html>
