<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#116149" />
  <title>Lopes Tur</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar"><div class="brand"><img class="brand-photo" src="lopes-tur-carro.png" alt="Carro Lopes Tur" /><div><span class="eyebrow">CONTROLE DO SEU CARRO</span><h1>Lopes Tur</h1></div></div><button class="icon-button" id="exportButton" title="Exportar dados">⇩</button></header>
  <main id="app" class="content"></main>
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button data-view="dashboard" class="active">⌂<span>Painel</span></button>
    <button data-view="income">＋<span>Ganhos</span></button>
    <button data-view="expense">−<span>Gastos</span></button>
    <button data-view="reports">▥<span>Relatórios</span></button>
    <button data-view="settings">⚙<span>Ajustes</span></button>
  </nav>
  <div id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="app.js?v=20260829"></script>
  <script>
    // A integração automática da Uber foi desativada. Mantemos a opção
    // "Uber" para lançamentos manuais de ganhos.
    function hideUberIntegration(root = document) {
      const nodes = root.querySelectorAll('*');
      nodes.forEach(el => {
        if (el.children.length > 0) return;
        const text = (el.textContent || '').trim().toLowerCase();
        const href = (el.getAttribute && el.getAttribute('href') || '').toLowerCase();
        const isIntegration =
          href.includes('lopes-tur-uber') ||
          ((text.includes('integração') || text.includes('integracao') || text.includes('conectar') || text.includes('sincronizar')) && text.includes('uber'));
        if (isIntegration) {
          const container = el.closest('button, a, .card, .form-card, section, .row-item, div');
          if (container && container.id !== 'app') container.remove();
        }
      });
    }
    const observer = new MutationObserver(() => hideUberIntegration());
    observer.observe(document.getElementById('app'), { childList: true, subtree: true });
    hideUberIntegration();
  </script>
</body>
</html>
