<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Lopes Tur | Acesso</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101827;color:#f8fafc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#1e3552,#101827 58%)}
    main{width:min(100%,420px);padding:32px;border:1px solid #334155;border-radius:18px;background:#172235;box-shadow:0 20px 60px #0005}
    .mark{font-size:13px;letter-spacing:.16em;color:#d6b56d;font-weight:700}
    h1{margin:10px 0 6px;font-size:28px}
    p{color:#aebbd0;line-height:1.5}
    label{display:block;margin:20px 0 7px;font-size:14px;color:#dbe4f0}
    input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white;font-size:16px}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#c6a45b;color:#101827;font-weight:700;font-size:16px;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #message{min-height:24px;margin-top:16px;font-size:14px}
    .ok{color:#86efac}.err{color:#fca5a5}
  </style>
</head>
<body>
  <main>
    <div class="mark">LOPES TUR EXECUTIVE</div>
    <h1>Acesso ao painel</h1>
    <p>Entre com o e-mail e a senha cadastrados.</p>
    <form id="login">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" value="lopestur26@gmail.com" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Entrar</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const supabase = createClient(
      'https://qvupmcucpcikpqkmbzvv.supabase.co',
      'sb_publishable_5Maz88GS4UxehYHvXKDv9Q_Q0PjI3Ma'
    );
    const form = document.getElementById('login');
    const button = document.getElementById('submit');
    const message = document.getElementById('message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'Verificando...';
      message.className = '';
      message.textContent = '';
      const { data, error } = await supabase.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });
      button.disabled = false;
      button.textContent = 'Entrar';
      if (error) {
        message.className = 'err';
        message.textContent = 'Não foi possível entrar. Confira o e-mail e a senha.';
        return;
      }
      message.className = 'ok';
      message.textContent = 'Acesso confirmado. Login realizado com sucesso.';
      form.querySelectorAll('input,button').forEach(el => el.disabled = true);
    });
  </script>
</body>
</html>
